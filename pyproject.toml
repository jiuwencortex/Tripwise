[project]
name = "tripwise"
version = "1.0.0"
description = "Tripwise — Multi-Agent Travel Planner (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.11",
    "uvicorn[standard]==0.40",
    "anthropic==0.40.0",
    "websockets==16.0",
    "httpx==0.28.1",
    "sse-starlette==3.0.3",
    "pydantic==2.11.7",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
# Deck-generation scripts under blog/jiuwenclaw_first/
pptx = ["python-pptx>=0.6.23"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff",
]

# Script-based FastAPI app (flat modules at repo root), not an installable package.
[tool.uv]
package = false
